<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>离线会议识别</title>
<style>body{margin:0;background:#f5f7fa;color:#182230;font:14px/1.5 "Microsoft YaHei",Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 56px}.head{margin-bottom:20px}.eyebrow{color:#175cd3;font-size:12px;font-weight:700;letter-spacing:.08em}.head h1{margin:6px 0;font-size:25px}.head p{margin:0;color:#667085}.head nav{margin:12px 0}.head nav a{color:#175cd3;text-decoration:none;margin-right:16px}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:8px;padding:20px;margin-bottom:16px}.drop{border:1px dashed #98a2b3;border-radius:7px;padding:30px;text-align:center;background:#fbfcfe}.drop strong{display:block;font-size:16px;margin-bottom:5px}.drop span{color:#667085;font-size:13px}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:16px}.field{display:flex;flex-direction:column;gap:6px;min-width:240px}.field label{font-size:12px;font-weight:700}.field input{height:38px;border:1px solid #cfd4dc;border-radius:5px;padding:0 10px;font:inherit}.btn{border:0;border-radius:5px;background:#175cd3;color:#fff;padding:9px 15px;cursor:pointer;font:inherit;font-weight:600}.btn:disabled{opacity:.5;cursor:not-allowed}.status{padding:10px 12px;background:#f8fafc;border-radius:5px;color:#667085;margin-top:15px}.status.error{background:#fff5f4;color:#b42318}.status.ok{background:#ecfdf3;color:#067647}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.pill{background:#eff4ff;color:#175cd3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}.text{white-space:pre-wrap;line-height:1.8;background:#fbfcfe;border:1px solid #eef0f3;border-radius:6px;padding:14px;min-height:60px}.table-wrap{overflow:auto;margin-top:15px}table{width:100%;border-collapse:collapse;min-width:940px}th,td{padding:10px;border-bottom:1px solid #eef0f3;text-align:left;vertical-align:top}th{background:#fbfcfe;font-size:12px;color:#667085}.speaker{font-weight:700;color:#175cd3;white-space:nowrap}.muted{color:#667085;font-size:12px}.match{font-size:12px;white-space:nowrap}.match.ok{color:#067647}.match.unknown{color:#b54708}.speaker-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin:10px 0 18px}.speaker-card{border:1px solid #e4e7ec;border-radius:7px;padding:13px;background:#fbfcfe}.speaker-card h3{margin:0 0 5px;font-size:15px}.speaker-card p{margin:3px 0;color:#667085;font-size:12px}.score{font-weight:700;color:#175cd3}.empty{padding:22px;text-align:center;color:#667085;border:1px dashed #e4e7ec;border-radius:6px}@media(max-width:640px){.wrap{padding:18px 12px 40px}.field{min-width:100%}.panel{padding:15px}}</style></head>
<body><main class="wrap"><header class="head"><div class="eyebrow">MEETING / OFFLINE</div><nav><a href="/meeting/realtime">在线识别</a><a href="/voiceprint/">声纹库管理</a><a href="/health_simple.html">系统健康</a></nav><h1>离线会议识别</h1><p>上传完整会议音频，系统将进行转码、VAD、离线转写和 CAM++ 说话人匹配。</p></header>
<section class="panel"><div class="drop"><strong>选择会议音频文件</strong><span>支持 WAV、MP3、M4A、FLAC 等格式，长音频建议使用离线识别</span><div class="row" style="justify-content:center"><input id="file" type="file" accept="audio/*"></div></div><div class="row"><div class="field"><label for="title">会议标题（可选）</label><input id="title" placeholder="例如：周一项目例会"></div><button class="btn" id="run" disabled>开始离线识别</button></div><div id="status" class="status">请先选择音频文件。</div></section>
<section class="panel" id="result" hidden><div class="summary"><span class="pill" id="meetingId"></span><span class="pill" id="duration"></span><span class="pill" id="matchConfig"></span></div><h2>说话人身份汇总</h2><div id="speakerSummary" class="speaker-summary"></div><h2>完整文本</h2><div id="fullText" class="text"></div><h2>分句结果</h2><div class="table-wrap"><table><thead><tr><th>说话人</th><th>时间段</th><th>状态</th><th>声纹匹配</th><th>有效片段</th><th>内容</th></tr></thead><tbody id="segments"></tbody></table></div></section></main>
<script>const $=id=>document.getElementById(id);let selected=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function time(ms){ms=Number(ms||0);return String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')+'.'+String(Math.floor(ms%1000/100))}function statusText(v){return ({matched:'已匹配',unknown:'未匹配',below_threshold:'低于阈值',ambiguous:'结果不明确',insufficient_audio:'有效音频不足',empty_library:'声纹库为空',not_processed:'未处理'}[v]||v||'未匹配')}function renderSpeakers(speakers){const entries=Object.entries(speakers||{});if(!entries.length){$('speakerSummary').innerHTML='<div class="empty">没有检测到可汇总的说话人。</div>';return}$('speakerSummary').innerHTML=entries.sort((a,b)=>Number(a[0])-Number(b[0])).map(([id,x])=>{const ok=x.status==='matched';const label=x.label||x.name||('说话人 '+id);return `<article class="speaker-card"><h3>说话人 ${esc(id)} → ${esc(label)}</h3><p>状态：<span class="match ${ok?'ok':'unknown'}">${esc(statusText(x.status))}</span>　相似度：<span class="score">${Number(x.score||0).toFixed(4)}</span>　差值：<span class="score">${Number(x.margin||0).toFixed(4)}</span></p><p>有效片段：${Number(x.segment_count||0)}${x.candidate_name&&!x.name?'　候选：'+esc(x.candidate_name):''}</p></article>`}).join('')}function renderSegments(rows){$('segments').innerHTML=(rows||[]).map(x=>{const score=Number(x.speaker_score||0),margin=Number(x.speaker_margin||0);return `<tr><td class="speaker">${esc(x.speaker_label||x.speaker_name||('说话人 '+(x.speaker??0)))}</td><td class="muted">${time(x.start_ms??x.start)} - ${time(x.end_ms??x.end)}</td><td class="match ${x.speaker_status==='matched'?'ok':'unknown'}">${esc(statusText(x.speaker_status))}</td><td class="muted">相似度：${score.toFixed(4)}<br>差值：${margin.toFixed(4)}</td><td class="muted">${Number(x.speaker_segment_count||0)}</td><td>${esc(x.text||'')}</td></tr>`}).join('')||'<tr><td colspan="6" class="muted">没有分句结果</td></tr>'}$('file').onchange=()=>{selected=$('file').files[0]||null;$('run').disabled=!selected;$('status').textContent=selected?'已选择：'+selected.name:'请先选择音频文件。'};$('run').onclick=async()=>{if(!selected)return;const f=new FormData();f.append('file',selected,selected.name);f.append('title',$('title').value);$('run').disabled=true;$('result').hidden=true;$('status').textContent='正在执行离线识别和说话人匹配，请耐心等待...';try{const r=await fetch('/api/v1/upload',{method:'POST',body:f});const d=await r.json();if(!r.ok||d.success===false)throw Error(d.error||'识别失败');$('meetingId').textContent='会议：'+(d.meeting_id||'-');$('duration').textContent=d.duration_ms?'时长：'+(Number(d.duration_ms)/1000).toFixed(1)+' 秒':'';const cfg=d.voice_match_config||{};$('matchConfig').textContent=`阈值 ${Number(cfg.similarity_threshold??0).toFixed(2)} · 最小差值 ${Number(cfg.min_margin??0).toFixed(2)}`;renderSpeakers(d.speakers);$('fullText').textContent=d.text||'未识别到有效文本';renderSegments(d.sentences);$('result').hidden=false;$('status').textContent='离线识别完成。';$('status').className='status ok'}catch(e){$('status').textContent='识别失败：'+e.message;$('status').className='status error'}finally{$('run').disabled=false}};</script></body></html>
