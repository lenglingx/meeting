<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>离线会议录音测试</title>
<style>
:root{--ink:#182230;--muted:#667085;--line:#e4e7ec;--bg:#f5f7fa;--blue:#175cd3;--green:#067647;--amber:#b54708;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Microsoft YaHei",Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 56px}.head{margin-bottom:20px}.eyebrow{color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.08em}.head h1{margin:6px 0;font-size:25px}.head p{margin:0;color:var(--muted)}.head nav{margin:12px 0}.head nav a{color:var(--blue);text-decoration:none;margin-right:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:16px}.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.method{border:1px solid var(--line);border-radius:7px;padding:15px}.method.selected{border-color:#84adff;background:#f5f8ff}.method h2{font-size:15px;margin:0 0 5px}.method p{margin:0 0 12px;color:var(--muted);font-size:12px}.method input[type=file]{width:100%;font:inherit}.record-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:5px;background:var(--blue);color:#fff;padding:9px 15px;cursor:pointer;font:inherit;font-weight:600}.btn.secondary{background:#fff;color:#344054;border:1px solid #cfd4dc}.btn:disabled{opacity:.5;cursor:not-allowed}.record-time{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}.preview{width:100%;height:34px;margin-top:12px}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:16px}.field{display:flex;flex-direction:column;gap:6px;min-width:260px}.field label{font-size:12px;font-weight:700}.field input{height:38px;border:1px solid #cfd4dc;border-radius:5px;padding:0 10px;font:inherit}.status{padding:10px 12px;background:#f8fafc;border-radius:5px;color:var(--muted);margin-top:15px}.status.error{background:#fff5f4;color:var(--red)}.status.ok{background:#ecfdf3;color:var(--green)}.text{white-space:pre-wrap;line-height:1.8;background:#fbfcfe;border:1px solid #eef0f3;border-radius:6px;padding:14px;min-height:60px}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.pill{background:#eff4ff;color:var(--blue);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}.table-wrap{overflow:auto;margin-top:15px}table{width:100%;border-collapse:collapse;min-width:940px}th,td{padding:10px;border-bottom:1px solid #eef0f3;text-align:left;vertical-align:top}th{background:#fbfcfe;font-size:12px;color:var(--muted)}.speaker{font-weight:700;color:var(--blue);white-space:nowrap}.muted{color:var(--muted);font-size:12px}.match{font-size:12px;white-space:nowrap}.match.ok{color:var(--green)}.match.unknown{color:var(--amber)}.speaker-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin:10px 0 18px}.speaker-card{border:1px solid var(--line);border-radius:7px;padding:13px;background:#fbfcfe}.speaker-card h3{margin:0 0 5px;font-size:15px}.speaker-card p{margin:3px 0;color:var(--muted);font-size:12px}.score{font-weight:700;color:var(--blue)}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}@media(max-width:700px){.input-grid{grid-template-columns:1fr}.field{min-width:100%}.panel{padding:15px}}
</style>
</head>
<body><main class="wrap"><header class="head"><div class="eyebrow">MEETING / OFFLINE RECORDING</div><nav><a href="/meeting/realtime">在线识别</a><a href="/meeting/offline">离线文件</a><a href="/voiceprint/">声纹库管理</a><a href="/health_simple.html">系统健康</a></nav><h1>离线会议录音测试</h1><p>可以直接用麦克风录制一段会议，再使用正式的离线 VAD、Paraformer、标点和 CAM++ 声纹匹配流程进行测试。</p></header>
<section class="panel"><div class="input-grid"><div class="method" id="fileMethod"><h2>上传会议音频</h2><p>适合测试已有的 WAV、MP3、M4A、FLAC 等会议文件。</p><input id="file" type="file" accept="audio/*"><audio id="filePreview" class="preview" controls hidden></audio></div><div class="method" id="recordMethod"><h2>离线会议录音</h2><p>使用浏览器麦克风录音，停止后试听并提交到同一套离线识别接口。</p><div class="record-row"><button class="btn" id="startRecord">开始录音</button><button class="btn secondary" id="stopRecord" disabled>停止录音</button><span id="recordTime" class="record-time">00:00</span></div><audio id="recordPreview" class="preview" controls hidden></audio></div></div><div class="row"><div class="field"><label for="title">会议标题（可选）</label><input id="title" placeholder="例如：离线录音测试会议"></div><button class="btn" id="run" disabled>开始离线识别</button></div><div id="status" class="status">请选择会议文件，或点击“开始录音”。</div></section>
<section class="panel" id="result" hidden><div class="summary"><span class="pill" id="meetingId"></span><span class="pill" id="duration"></span><span class="pill" id="matchConfig"></span></div><h2>说话人身份汇总</h2><div id="speakerSummary" class="speaker-summary"></div><h2>完整文本</h2><div id="fullText" class="text"></div><h2>分句结果</h2><div class="table-wrap"><table><thead><tr><th>说话人</th><th>时间段</th><th>状态</th><th>声纹匹配</th><th>有效片段</th><th>内容</th></tr></thead><tbody id="segments"></tbody></table></div></section></main>
<script>
const $=id=>document.getElementById(id);let selected=null,recordingBlob=null,rec=null,stream=null,chunks=[],timer=null,seconds=0;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=ms=>{ms=Number(ms||0);return String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')+'.'+String(Math.floor(ms%1000/100))};
const statusText=v=>({matched:'已匹配',unknown:'未匹配',below_threshold:'低于阈值',ambiguous:'结果不明确',insufficient_audio:'有效音频不足',empty_library:'声纹库为空',not_processed:'未处理'}[v]||v||'未匹配');
const setStatus=(text,kind='')=>{$('status').textContent=text;$('status').className='status'+(kind?' '+kind:'')};
function renderSpeakers(speakers){const entries=Object.entries(speakers||{});$('speakerSummary').innerHTML=entries.length?entries.sort((a,b)=>Number(a[0])-Number(b[0])).map(([id,x])=>{const ok=x.status==='matched',label=x.label||x.name||('说话人 '+id);return `<article class="speaker-card"><h3>说话人 ${esc(id)} → ${esc(label)}</h3><p>状态：<span class="match ${ok?'ok':'unknown'}">${esc(statusText(x.status))}</span>　相似度：<span class="score">${Number(x.score||0).toFixed(4)}</span>　差值：<span class="score">${Number(x.margin||0).toFixed(4)}</span></p><p>有效片段：${Number(x.segment_count||0)}</p></article>`}).join(''):'<div class="empty">没有检测到可汇总的说话人。</div>'}
function renderSegments(rows){$('segments').innerHTML=(rows||[]).map(x=>{const score=Number(x.speaker_score||0),margin=Number(x.speaker_margin||0);return `<tr><td class="speaker">${esc(x.speaker_label||x.speaker_name||('说话人 '+(x.speaker??0)))}</td><td class="muted">${time(x.start_ms??x.start)} - ${time(x.end_ms??x.end)}</td><td class="match ${x.speaker_status==='matched'?'ok':'unknown'}">${esc(statusText(x.speaker_status))}</td><td class="muted">相似度：${score.toFixed(4)}<br>差值：${margin.toFixed(4)}</td><td class="muted">${Number(x.speaker_segment_count||0)}</td><td>${esc(x.text||'')}</td></tr>`}).join('')||'<tr><td colspan="6" class="muted">没有分句结果</td></tr>'}
function chooseInput(blob,type,label){selected=blob;recordingBlob=type==='recording'?blob:null;$('fileMethod').classList.toggle('selected',type==='file');$('recordMethod').classList.toggle('selected',type==='recording');$('run').disabled=!selected;setStatus('当前输入：'+label+'，点击“开始离线识别”。')}
$('file').onchange=()=>{const f=$('file').files[0]||null;if(!f)return;recordingBlob=null;$('filePreview').src=URL.createObjectURL(f);$('filePreview').hidden=false;$('recordPreview').hidden=true;chooseInput(f,'file','本地文件 '+f.name)};
$('startRecord').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});if(!window.MediaRecorder)throw Error('当前浏览器不支持录音');chunks=[];seconds=0;$('recordTime').textContent='00:00';rec=new MediaRecorder(stream);rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{clearInterval(timer);recordingBlob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});recordingBlob.name='meeting-recording.webm';$('recordPreview').src=URL.createObjectURL(recordingBlob);$('recordPreview').hidden=false;$('filePreview').hidden=true;stream.getTracks().forEach(t=>t.stop());stream=null;chooseInput(recordingBlob,'recording','浏览器录音');$('startRecord').disabled=false;$('stopRecord').disabled=true};rec.start();$('startRecord').disabled=true;$('stopRecord').disabled=false;timer=setInterval(()=>{seconds++;$('recordTime').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')},1000);setStatus('正在录音，请自然连续地讲话...')}catch(e){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}setStatus('无法开始录音：'+e.message,'error')}};
$('stopRecord').onclick=()=>{if(rec&&rec.state!=='inactive')rec.stop();$('stopRecord').disabled=true};
$('run').onclick=async()=>{if(!selected)return;const f=new FormData();f.append('file',selected,selected.name||'meeting-recording.webm');f.append('title',$('title').value.trim());$('run').disabled=true;$('result').hidden=true;setStatus('正在执行离线识别和 CAM++ 说话人匹配，请耐心等待...');try{const r=await fetch('/api/v1/upload',{method:'POST',body:f});const d=await r.json();if(!r.ok||d.success===false)throw Error(d.error||'识别失败');$('meetingId').textContent='会议：'+(d.meeting_id||'-');$('duration').textContent=d.duration_ms?'时长：'+(Number(d.duration_ms)/1000).toFixed(1)+' 秒':'';const cfg=d.voice_match_config||{};$('matchConfig').textContent=`阈值 ${Number(cfg.similarity_threshold??0).toFixed(2)} · 最小差值 ${Number(cfg.min_margin??0).toFixed(2)}`;renderSpeakers(d.speakers);$('fullText').textContent=d.text||'未识别到有效文本';renderSegments(d.sentences);$('result').hidden=false;setStatus('离线识别完成。','ok')}catch(e){setStatus('识别失败：'+e.message,'error')}finally{$('run').disabled=!selected}};
</script></body></html>
